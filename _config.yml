# ─────────────────────────────────────────────────────────────
#  ECG@RVHS website — site settings
#  Most people never need to touch this file.
#  Lines marked  # ← EDIT  are the ones the editor may change.
# ─────────────────────────────────────────────────────────────

title: ECG@RVHS
description: Education and Career Guidance at River Valley High School

# Web address. Filled in when the repository is created.
url: "https://arkdein.github.io"          # ← EDIT (set at setup)
baseurl: "/ecg-site"                       # ← EDIT (set at setup)

# While true: tells search engines not to list the site and shows
# the TODO boxes. Set to false at go-live. (No banner since 14 Oct 2026.)
draft: true                                # ← EDIT at go-live

# Current Opportunities list: the "Publish to web" CSV link of the
# Opportunities public tab in the Google Sheet "ECG Opportunities and Announcements (website feed)".
# Leave empty to show sample listings.
opportunities_csv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5GulSl-PRYTpvAqoLXM_ohatOLSqggc7kzFniGNZZ-ACLOeag8pnM14APSZdwcF8xjcSbo5Y_9e5e/pub?gid=1427148673&single=true&output=csv"   # ← EDIT

# Key Announcements on Home: the "Publish to web" CSV link of the
# "Announcements public" tab in the same Google Sheet. While empty, the
# block stays hidden (add ?preview=announcements to see sample ones).
announcements_csv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5GulSl-PRYTpvAqoLXM_ohatOLSqggc7kzFniGNZZ-ACLOeag8pnM14APSZdwcF8xjcSbo5Y_9e5e/pub?gid=502&single=true&output=csv"   # ← EDIT

# "Was this page helpful?" buttons at the bottom of every page:
# the PREFILL TEMPLATE link printed by the feedback-form script
# (it contains PAGE_NAME and =Yes). Leave empty to hide the buttons.
feedback_form_prefill: "https://docs.google.com/forms/d/e/1FAIpQLSct7nJ6J-WR4TjOH0YqWfqj2q3yU_6xxC7uQWRilWcv3zjg6w/viewform?usp=pp_url&entry.351100549=PAGE_NAME&entry.1090494934=Yes"                  # ← EDIT

# "ECG Committee: request an edit" link at the bottom of every page:
# the PREFILL link from the edit-requests Form script (it contains PAGE_URL).
# The Form only accepts named committee members (Publish > Restricted).
# Leave empty to hide the link.
edit_request_form_prefill: "https://docs.google.com/forms/d/e/1FAIpQLScYI_xhyg-PZxYaw8rvLqNpQVipq3Xq9mJX4pfd5YQ6a1blRw/viewform?usp=pp_url&entry.332194054=PAGE_URL"   # ← EDIT

# "Get the weekly ECG update" box on Home and Current Opportunities, and the
# Weekly ECG update page (/weekly-update.html). Both lines are needed:
#   weekly_update_signup: the public link of the sign-up Form
#                         (printed by scripts/weekly-update-signups.gs)
#   weekly_update_group:  the Google Group's address, e.g. rvhs-ecg-weekly@googlegroups.com
# Leave either empty to hide the box. See WEEKLY-UPDATE.md.
weekly_update_signup: ""   # ← EDIT
weekly_update_group: ""    # ← EDIT

# Google Analytics 4 (page views for the Webmaster's Dashboard).
# Paste the Measurement ID (starts with G-) between the quotes and
# remove the # at the start of the line. Leave the # in place to
# switch tracking off. See DASHBOARD.md.
ga_tracking: "G-VBQEB9BZ5P"               # ← EDIT (put # at the start of this line to switch tracking off)

# Design (Just the Docs theme, loaded by GitHub)
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true

color_scheme: rvhs
crest: "/assets/images/rvhs-crest.png"   # school crest shown in the sidebar (use approved by the school: TODO)
search_enabled: true
heading_anchors: true

# "On this page" lists show headings down to ### only, so the
# small step headings (####) on a page don't crowd the list.
kramdown:
  toc_levels: 1..3
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Book an ECG appointment":
    - "/ecg-site/get-help.html#book-a-session"   # ← EDIT if the repository name changes
aux_links_new_tab: false

# "Edit this page" link at the bottom of every page
gh_edit_link: true
gh_edit_link_text: "Suggest a change to this page"
gh_edit_repository: "https://github.com/Arkdein/ecg-site"   # ← EDIT (set at setup)
gh_edit_branch: "main"
gh_edit_view_mode: "edit"


callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: red
  deadline:
    title: Deadline
    color: yellow
  tip:
    title: Tip
    color: green

# Files that stay in the repository but are not published
exclude:
  - README.md
  - EDITING.md
  - DASHBOARD.md
  - WEEKLY-UPDATE.md
  - scripts/
  - STYLE.md
  - MIGRATION.md
  - templates/
  - tests/
  - Gemfile
  - Gemfile.lock
